<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">Amir Ibrahim</title>
  <!--
    Favicon. Constraints that drove this:
    - Letterforms are drawn as strokes, not <text>. Favicon renderers frequently
      lack the requested font and silently substitute another one.
    - Bone on oxblood is 9.57:1. The previous icon put #880808 on a near-black
      field at 1.95:1, which collapsed into an unreadable blob at 16px.
    - Full-bleed square, no gradient, no corner radius, matching the page.
    - A single "A" rather than "AI", which reads as "artificial intelligence".
  -->
  <rect width="256" height="256" fill="#880808" />
  <path
    d="M62 206 L128 54 L194 206"
    fill="none"
    stroke="#FAF9F7"
    stroke-width="34"
    stroke-linejoin="miter"
    stroke-miterlimit="8"
  />
  <path d="M92 158 L164 158" stroke="#FAF9F7" stroke-width="28" />
</svg>
